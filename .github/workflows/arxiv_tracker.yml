name: ArXiv Daily Keyword Tracker

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  run-tracker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Executar Script do ArXiv
        run: python main.py

      - name: Commitar histórico e gráfico no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add historico.json grafico_tendencias.png
          git commit -m "data: atualiza histórico e gráfico de tendências [skip ci]" || exit 0
          git push origin HEAD:${{ github.ref_name }}